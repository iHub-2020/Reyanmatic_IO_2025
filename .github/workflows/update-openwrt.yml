#              Triggers Build OpenWrt on upstream changes or manual dispatch.

name: update-openwrt

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_EVENT_TYPE: Build_OpenWrt_Official

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 6'
    - cron: '0 2 28 * *'

jobs:
  check_and_trigger_build:
    runs-on: ubuntu-latest
    outputs:
      triggered_build: ${{ steps.dispatch.conclusion == 'success' && 'true' || 'false' }}
      trigger_reason: ${{ steps.trigger_logic.outputs.reason }}
      upstream_commit: ${{ steps.getHash.outputs.combinedHash || 'N/A' }}

    steps:
      - name: Determine trigger mode
        id: trigger_logic
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "reason=Manual Trigger (Force Build)" >> $GITHUB_OUTPUT
            echo "force_build=true"                   >> $GITHUB_OUTPUT
            echo "==> Manual dispatch: will force-trigger build immediately."
          elif [ "${{ github.event.schedule }}" == "0 2 28 * *" ]; then
            echo "reason=Monthly Forced Build (feeds refresh)" >> $GITHUB_OUTPUT
            echo "force_build=true"                   >> $GITHUB_OUTPUT
            echo "==> Monthly schedule: force-trigger build (refresh feeds/passwall2 etc.)."
          else
            echo "reason=Scheduled Weekly Check"      >> $GITHUB_OUTPUT
            echo "force_build=false"                  >> $GITHUB_OUTPUT
            echo "==> Scheduled check: will collect watched sources' hashes and compare."
          fi

      - name: Collect watched upstream hashes
        id: getHash
        if: steps.trigger_logic.outputs.force_build == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          SOURCES="
          openwrt/openwrt|openwrt-25.12|
          vernesong/OpenClash|master|
          Openwrt-Passwall/openwrt-passwall2|main|
          Openwrt-Passwall/openwrt-passwall-packages|main|
          openwrt/packages|openwrt-25.12|net/tailscale
          openwrt/luci|openwrt-25.12|applications/luci-app-tailscale-community
          "
          combined=""
          while IFS='|' read -r repo ref path; do
            repo=$(echo "$repo" | tr -d '[:space:]')
            ref=$(echo "$ref"   | tr -d '[:space:]')
            path=$(echo "$path" | tr -d '[:space:]')
            [ -z "$repo" ] && continue
            url="https://api.github.com/repos/$repo/commits?sha=$ref&per_page=1"
            [ -n "$path" ] && url="$url&path=$path"
            sha=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" "$url" | jq -r '.[0].sha')
            if [ -z "$sha" ] || [ "$sha" = "null" ]; then
              echo "hash fetch failed"; exit 1
            fi
            combined="${combined}${repo}:${sha}"$'\n'
          done <<< "$SOURCES"
          COMBINED=$(printf '%s' "$combined" | sha256sum | cut -c1-40)
          echo "combined hash computed"
          echo "combinedHash=$COMBINED" >> "$GITHUB_OUTPUT"

      - name: Compare with cached combined hash
        id: cacheHash
        if: steps.trigger_logic.outputs.force_build == 'false'
        uses: actions/cache@v4
        with:
          path: .watchedHash_openwrt
          key: watched-openwrt-${{ steps.getHash.outputs.combinedHash }}

      - name: Save new combined hash to cache
        if: |
          steps.trigger_logic.outputs.force_build == 'false' &&
          steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo "update detected"
          echo "${{ steps.getHash.outputs.combinedHash }}" > .watchedHash_openwrt

      - name: Trigger Build OpenWrt Workflow
        id: dispatch
        if: |
          steps.trigger_logic.outputs.force_build == 'true' ||
          (steps.trigger_logic.outputs.force_build == 'false' && steps.cacheHash.outputs.cache-hit != 'true')
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          repository: ${{ github.repository }}
          event-type: ${{ env.TARGET_EVENT_TYPE }}
          client-payload: >
            {
              "trigger_reason": "${{ steps.trigger_logic.outputs.reason }}",
              "watched_combined_hash": "${{ steps.getHash.outputs.combinedHash || 'N/A (forced build)' }}",
              "cache_hit": "${{ steps.cacheHash.outputs.cache-hit || 'N/A (forced build)' }}"
            }

      - name: Summary
        if: always()
        run: |
          echo "## update-openwrt Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ steps.trigger_logic.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Watched Combined Hash | ${{ steps.getHash.outputs.combinedHash || 'N/A (forced build)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache Hit (no update) | ${{ steps.cacheHash.outputs.cache-hit || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Triggered | ${{ steps.dispatch.conclusion == 'success' && 'YES' || (steps.dispatch.conclusion == 'skipped' && 'NO (no upstream change)' || 'NO') }} |" >> $GITHUB_STEP_SUMMARY

      - name: Delete old workflow runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          gh run list --workflow update-openwrt --repo ${{ github.repository }} --limit 100 --json databaseId,status \
            -q '[.[] | select(.status != "in_progress")] | .[4:] | .[].databaseId' | \
            xargs -I{} gh run delete {} --repo ${{ github.repository }} 2>/dev/null || true
