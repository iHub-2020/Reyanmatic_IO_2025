
name: build-openwrt

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  repository_dispatch:
    types: [Build_OpenWrt_Official]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.name || 'single' }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            config: x86_64.config
            diy_part: diy-part2.sh
            tag_prefix: x86
          - name: R2S
            config: R2S.config
            diy_part: diy-part3.sh
            tag_prefix: R2S
          - name: R5C
            config: R5C.config
            diy_part: diy-part4.sh
            tag_prefix: R5C

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch assets
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: _source
          sparse-checkout: image-build

      - name: Init environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install --no-install-recommends -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man \
            intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

      - name: System information
        run: |
          nproc; free -h

      - name: Prepare build space
        timeout-minutes: 20
        uses: ./.github/actions/maximize-disk-space
        with:
          build-mount-path: /workdir
          swap-size-mb: 4096

      - name: Get source
        working-directory: /workdir
        run: |
          REPO_URL="https://github.com/openwrt/openwrt"
          git clone ${REPO_URL} -b ${REPO_BRANCH} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Cache dl & ccache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/.ccache
          key: bcache-official-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            bcache-official-${{ matrix.name }}-

      - name: Prepare feeds
        run: |
          UPSTREAM="_source/image-build/OpenWrt"
          [ -e ${UPSTREAM}/${FEEDS_CONF} ] && cp ${UPSTREAM}/${FEEDS_CONF} openwrt/feeds.conf.default
          chmod +x ${UPSTREAM}/diy-part1.sh
          cd openwrt
          $GITHUB_WORKSPACE/${UPSTREAM}/diy-part1.sh >/dev/null 2>&1 || { echo "feeds step failed"; exit 1; }

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a >/dev/null 2>&1

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a >/dev/null 2>&1
          if grep -q '^src-git passwall_packages ' feeds.conf.default; then
            ./scripts/feeds install -a -f -p passwall_packages >/dev/null 2>&1
          fi

      - name: Configure
        env:
          ROOT_PASSWORD_HASH: ${{ secrets.ROOT_PASSWORD_HASH }}
        run: |
          UPSTREAM="_source/image-build/OpenWrt"
          rm -rf openwrt/files
          [ -d ${UPSTREAM}/files ] && cp -rf ${UPSTREAM}/files openwrt/files
          cp ${UPSTREAM}/${{ matrix.config }} openwrt/.config
          chmod +x ${UPSTREAM}/${{ matrix.diy_part }}
          cd openwrt
          $GITHUB_WORKSPACE/${UPSTREAM}/${{ matrix.diy_part }} >/dev/null 2>&1 || { echo "customization step failed"; exit 1; }

      - name: Prepare packages
        run: |
          cd openwrt
          make defconfig
          make download -j8 >/dev/null 2>&1
          find dl -maxdepth 1 -type f -size -1024c -exec rm -f {} \; 2>/dev/null || true

      - name: Build firmware
        id: compile
        run: |
          cd openwrt
          set -e
          if ! make -j$(nproc); then
            if ! make -j1; then
              make -j1 V=s
              exit 1
            fi
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Post-process images
        if: steps.compile.outputs.status == 'success' && matrix.name == 'x86_64'
        run: |
          cd openwrt/bin/targets/*/*
          shopt -s nullglob
          q=(*.qcow2)
          if [ ${#q[@]} -eq 0 ]; then
            for v in *.vmdk; do qemu-img convert -f vmdk -O qcow2 "$v" "${v%.vmdk}.qcow2"; done
          fi >/dev/null 2>&1 || true

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          case "${{ matrix.name }}" in
            x86_64)
              find . -type f ! \( -name '*.qcow2' -o -name '*.img.gz' -o -name '*.vmdk' -o -name '*.vdi' \) -delete
              ;;
            R2S)
              find . -type f ! -name '*.img.gz' -delete
              ;;
            R5C)
              find . -type f ! -name '*.img.gz' -delete
              ;;
          esac
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware_Official_${{ matrix.name }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_DIR }}

      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success'
        run: |
          echo "release_tag=OpenWrt-${{ matrix.tag_prefix }}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          cat > release.txt <<'RELNOTE'
          Reyanmatic OpenWrt 固件

          镜像文件说明与刷机方式见仓库 README。
          刷机有风险，请先备份原固件与数据。
          RELNOTE
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success' && steps.tag.outputs.status == 'success'
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE_DIR }}/*

      - name: Delete old workflow runs
        if: steps.compile.outputs.status == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          gh run list --workflow build-openwrt --repo ${{ github.repository }} --limit 100 --json databaseId,status \
            -q '[.[] | select(.status != "in_progress")] | .[4:] | .[].databaseId' | \
            xargs -I{} gh run delete {} --repo ${{ github.repository }} 2>/dev/null || true

      - name: Remove old Releases
        if: steps.compile.outputs.status == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          # 只清理本构建线（OpenWrt-*）的旧版，避免顶掉另一条线；每线保留 12 个（6 轮 x 双机型）
          gh release list --repo ${{ github.repository }} --limit 100 \
            --json tagName -q '[.[] | select(.tagName | startswith("OpenWrt-"))] | .[12:] | .[].tagName' | \
            while read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag -y 2>/dev/null || true
            done
