name: 'Prepare Build Space'
description: 'Free up and expand disk space on the runner.'
author: 'Reyanmatic'

inputs:
  remove-android:
    description: 'Remove preinstalled Android SDK/NDK'
    required: false
    default: 'true'
  remove-dotnet:
    description: 'Remove preinstalled .NET'
    required: false
    default: 'true'
  remove-haskell:
    description: 'Remove preinstalled Haskell'
    required: false
    default: 'true'
  remove-codeql:
    description: 'Remove preinstalled CodeQL'
    required: false
    default: 'true'
  remove-tool-cache:
    description: 'Remove preinstalled tool cache'
    required: false
    default: 'true'
  remove-docker-images:
    description: 'Remove preinstalled Docker'
    required: false
    default: 'true'
  remove-large-packages:
    description: 'Remove large preinstalled packages'
    required: false
    default: 'true'
  remove-swap-storage:
    description: 'Remove preinstalled swap'
    required: false
    default: 'true'

  build-mount-path:
    description: 'Build working directory mount path'
    required: false
    default: '/workdir'
  build-mount-path-ownership:
    description: 'Mount path ownership'
    required: false
    default: 'runner:runner'
  root-reserve-mb:
    description: 'Free space to reserve on / (MB)'
    required: false
    default: '8192'
  temp-reserve-mb:
    description: 'Free space to reserve on /mnt (MB)'
    required: false
    default: '1024'
  swap-size-mb:
    description: 'Swap size (MB), 0 to disable'
    required: false
    default: '4096'
  overprovision-lvm:
    description: 'Use thin-pool overprovisioning'
    required: false
    default: 'false'
  pv-loop-path:
    description: 'Loop image path on /'
    required: false
    default: '/pv.img'
  tmp-pv-loop-path:
    description: 'Loop image path on /mnt'
    required: false
    default: '/mnt/tmp-pv.img'

runs:
  using: 'composite'
  steps:
    - name: Prepare build space
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/maximize.sh"
        "${{ github.action_path }}/maximize.sh"
      env:
        INPUT_REMOVE_ANDROID: ${{ inputs.remove-android }}
        INPUT_REMOVE_DOTNET: ${{ inputs.remove-dotnet }}
        INPUT_REMOVE_HASKELL: ${{ inputs.remove-haskell }}
        INPUT_REMOVE_CODEQL: ${{ inputs.remove-codeql }}
        INPUT_REMOVE_TOOL_CACHE: ${{ inputs.remove-tool-cache }}
        INPUT_REMOVE_DOCKER_IMAGES: ${{ inputs.remove-docker-images }}
        INPUT_REMOVE_LARGE_PACKAGES: ${{ inputs.remove-large-packages }}
        INPUT_REMOVE_SWAP_STORAGE: ${{ inputs.remove-swap-storage }}
        INPUT_BUILD_MOUNT_PATH: ${{ inputs.build-mount-path }}
        INPUT_BUILD_MOUNT_PATH_OWNERSHIP: ${{ inputs.build-mount-path-ownership }}
        INPUT_ROOT_RESERVE_MB: ${{ inputs.root-reserve-mb }}
        INPUT_TEMP_RESERVE_MB: ${{ inputs.temp-reserve-mb }}
        INPUT_SWAP_SIZE_MB: ${{ inputs.swap-size-mb }}
        INPUT_OVERPROVISION_LVM: ${{ inputs.overprovision-lvm }}
        INPUT_PV_LOOP_PATH: ${{ inputs.pv-loop-path }}
        INPUT_TMP_PV_LOOP_PATH: ${{ inputs.tmp-pv-loop-path }}
